<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Will You Go On A Date With Me? ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;

    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at 20% 20%, #ffdce6, transparent 35%),
        radial-gradient(circle at 80% 80%, #ffc8d9, transparent 35%),
        linear-gradient(135deg, #fff8fa, #ffe5ed);

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================
   MAIN CARD
========================= */

.card {
    width: min(92%, 560px);
    min-height: 430px;

    padding: 55px 35px;

    border-radius: 32px;

    background: rgba(255, 255, 255, .88);

    backdrop-filter: blur(18px);

    box-shadow:
        0 30px 80px rgba(170, 40, 80, .17);

    text-align: center;

    position: relative;
    z-index: 10;
}


.love-icon {
    font-size: 68px;

    animation: heartbeat 1.4s infinite;
}


@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }

}


h1 {
    margin-top: 18px;

    font-size: clamp(30px, 6vw, 44px);

    color: #292023;

    line-height: 1.15;
}


.subtitle {
    margin-top: 18px;

    color: #765d65;

    line-height: 1.6;

    font-size: 17px;
}


/* =========================
   BUTTON AREA
========================= */

.buttons {
    margin-top: 24px;

    height: clamp(220px, 27vw, 280px);

    display: flex;

    align-items: flex-end;

    justify-content: center;

    gap: 25px;
}


button {
    padding: 15px 35px;

    border: 0;

    border-radius: 100px;

    font-size: 18px;

    font-weight: 700;

    cursor: pointer;

    user-select: none;
}


/* YES */

#yesBtn {
    align-self: flex-start;
    color: white;

    background:
        linear-gradient(
            135deg,
            #ff517c,
            #e92e62
        );

    box-shadow:
        0 12px 30px rgba(233, 46, 98, .3);

    transition: .25s;

    position: relative;

    z-index: 200;
}


#yesBtn:hover {
    transform: scale(1.1);
}


/* NO */

#noBtn {
    background: #eee9eb;

    color: #58464d;

    position: relative;

    z-index: 500;

    transition:
        left .48s cubic-bezier(.22, .9, .35, 1),
        top .48s cubic-bezier(.22, .9, .35, 1),
        transform .2s ease;
}


/* =========================
   CAT
========================= */

.cat {
    position: fixed;
    width: clamp(100px, 18vw, 150px);
    aspect-ratio: 1;
    z-index: 600;
    pointer-events: none;
}
.cat-art { position: absolute; inset: 0; transform: scaleX(var(--facing, 1)); }
.cat-sprite { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 4px 3px #51342118); }
.cat-groom { display: none; filter: none; }
.cat-groom-frame, .cat-run-frame { position: absolute; inset: 0; background-size: 400% 300%; background-repeat: no-repeat; }
.cat-groom-frame { background-image: url('assets/cat-grooming-12.png'); }
.groom-grounded {
    position: absolute; inset: 0;
    background: url('assets/cat-grooming-12.png') 0 0 / 400% 300% no-repeat;
    mask-image: linear-gradient(to bottom, transparent 59%, black 76%);
}
.groom-motion {
    position: absolute; inset: 0 -25% 0 0;
    mask-image: linear-gradient(to bottom, black 59%, transparent 76%);
}
.groom-motion .cat-groom-frame { right: auto; width: 80%; }
.cat-run-frame { background-image: url('assets/cat-running-12.png'); display: none; }
.cat[data-run-ready="true"] .cat-run-frame { display: block; }
.cat[data-run-ready="true"] .run-fallback { visibility: hidden; }
.run-fallback { width: 100%; height: 100%; }
.cat[data-state="sitting"][data-groom-ready="true"] .cat-groom { display: block; }
.cat[data-state="sitting"][data-groom-ready="true"] .cat-sit { visibility: hidden; }
.cat[data-state="sitting"] .cat-groom { transform: scale(.95); transform-origin: 65% 90%; }
.cat-run { opacity: 0; overflow: visible; transform: scale(1.1); transform-origin: 50% 90%; }
.cat[data-state="sitting"] .cat-sit { animation: breathe 3.6s ease-in-out infinite; transform-origin: 65% 90%; }
.cat::after { content: ''; position: absolute; left: 27%; bottom: 7%; width: 55%; height: 5%; border-radius: 50%; background: #60433420; filter: blur(5px); z-index: -1; opacity: .5; }
.cat:not([data-state="sitting"])::after { opacity: 0; }
@keyframes breathe { 0%,100% { transform: scale(.95, 1); } 50% { transform: scale(.95, 1.008); } }
#noBtn { box-shadow: 0 6px 12px #58464d20; transform-origin: 50% 3px; z-index: 650; }
#noBtn.in-mouth { box-shadow: 0 12px 18px #58464d25; pointer-events: none; }
button:focus-visible { outline: 3px solid #e92e62; outline-offset: 5px; }
.cat-text {
    position: absolute; top: -34px; left: 50%; transform: translateX(-50%);
    white-space: nowrap; background: white; padding: 8px 13px;
    border-radius: 15px; font-size: 13px; font-weight: 700; color: #c52f59;
    box-shadow: 0 6px 18px #00000015; opacity: 0; transition: opacity .2s;
}
.cat[data-state="biting"] .cat-text { opacity: 1; }
#noBtn { transition: none; touch-action: manipulation; }
@media (prefers-reduced-motion: reduce) {
    .love-icon, .success-heart, .success-content, .boom-heart, .cat[data-state="sitting"] .cat-sit { animation: none; }
}

/* =========================
   SUCCESS SCREEN
========================= */

.success {
    position: fixed;

    inset: 0;

    z-index: 10000;

    display: none;

    align-items: center;

    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle,
            white,
            #ffe4ed,
            #ffc3d6
        );
}


.success.show {
    display: flex;

    animation:
        successFade .5s ease;
}


@keyframes successFade {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }

}


.success-content {
    animation:
        successPop
        .7s
        cubic-bezier(.2, 1, .3, 1);
}


@keyframes successPop {

    from {
        opacity: 0;

        transform:
            scale(.4);
    }

    to {
        opacity: 1;

        transform:
            scale(1);
    }

}


.success-heart {
    font-size: 100px;

    animation:
        heartbeat 1s infinite;
}


.success h2 {
    font-size:
        clamp(42px, 8vw, 70px);

    color: #e82f62;

    margin-top: 15px;
}


.success p {
    margin-top: 18px;

    font-size: 20px;

    color: #6a5159;

    line-height: 1.6;
}

.date-modal {
    position: fixed;
    inset: 0;
    z-index: 15000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #3d202c66;
    backdrop-filter: blur(8px);
}

.date-modal.show { display: flex; }

.date-dialog {
    width: min(100%, 390px);
    padding: 30px 26px;
    border-radius: 24px;
    background: #fff;
    box-shadow: 0 24px 70px #6f294633;
    text-align: left;
}

.date-dialog h2 {
    color: #292023;
    font-size: 25px;
}

.date-dialog p {
    margin-top: 8px;
    color: #765d65;
}

.date-fields {
    display: grid;
    gap: 16px;
    margin-top: 22px;
}

.date-fields label {
    display: grid;
    gap: 7px;
    color: #58464d;
    font-size: 14px;
    font-weight: 700;
}

.date-fields input {
    width: 100%;
    padding: 12px 13px;
    border: 1px solid #ead5dc;
    border-radius: 12px;
    color: #292023;
    font: inherit;
}

.date-fields input:focus {
    outline: 3px solid #ffb4c8;
    border-color: #e92e62;
}

#confirmDate {
    width: 100%;
    margin-top: 22px;
    color: #fff;
    background: #e92e62;
}


/* =========================
   HEART EXPLOSION
========================= */

.boom-heart {
    position: fixed;

    pointer-events: none;

    z-index: 20000;

    animation:
        boomHeart 1.5s ease-out forwards;
}


@keyframes boomHeart {

    from {
        transform:
            translate(0, 0)
            scale(.5);

        opacity: 1;
    }

    to {
        transform:
            translate(
                var(--x),
                var(--y)
            )
            rotate(
                var(--r)
            )
            scale(1.5);

        opacity: 0;
    }

}


/* =========================
   MOBILE
========================= */

@media(max-width: 650px) {

    .card {
        padding:
            40px
            22px;

        min-height: 400px;
    }





    .buttons {
        gap: 15px;
    }


    button {
        padding:
            14px
            28px;
    }

}

</style>
</head>


<body>


<!-- =========================
     MAIN CARD
========================= -->

<div class="card">

    <div class="love-icon">
        🥺❤️
    </div>


    <h1>
        Will you go on a date with me?
    </h1>


    <p class="subtitle">

        Just one date... 🌹

        <br>

        I promise I'll try to make it
        worth saying yes.

    </p>


    <div class="buttons">

        <button id="yesBtn">
            Yes ❤️
        </button>


        <button id="noBtn">
            No
        </button>

    </div>

</div>



<!-- =========================
     REAL CAT
========================= -->

<div class="cat" id="cat" aria-hidden="true">
    <div class="cat-text" id="catText">Don't touch that.</div>
    <div class="cat-art">
        <img class="cat-sprite cat-sit" id="catSit" src="assets/cat-realistic.png" alt="" draggable="false">
        <div class="cat-sprite cat-groom" id="catGroom">
            <div class="groom-grounded" id="groomGrounded"></div>
            <div class="groom-motion">
                <div class="cat-groom-frame" id="groomBack"></div>
                <div class="cat-groom-frame" id="groomFront"></div>
            </div>
        </div>
        <div class="cat-sprite cat-run" id="catRun">
            <img class="run-fallback" src="assets/cat-running.png" alt="" draggable="false">
            <div class="cat-run-frame" id="runBack"></div>
            <div class="cat-run-frame" id="runFront"></div>
        </div>
    </div>
</div>

<div class="date-modal" id="dateModal" role="dialog" aria-modal="true" aria-labelledby="dateTitle">
    <form class="date-dialog" id="dateForm">
        <h2 id="dateTitle">Plan our date 💕</h2>
        <p>Choose a date and time for us.</p>
        <div class="date-fields">
            <label>
                Date
                <input id="datePicker" type="date" required>
            </label>
            <label>
                Time
                <input id="timePicker" type="time" required>
            </label>
        </div>
        <button id="confirmDate" type="submit">Done ❤️</button>
    </form>
</div>

<!-- =========================
     SUCCESS
========================= -->

<div
    class="success"
    id="success"
>


    <div class="success-content">


        <div class="success-heart">
            ❤️
        </div>


        <h2>
            It's a Date!
        </h2>


        <p>

            Best answer possible. 🥰

            <br>

            Now I just need to plan
            something special for you.

        </p>


    </div>


</div>



<script src="cat-animation.js"></script>

</body>
</html>
